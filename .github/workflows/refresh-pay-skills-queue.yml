name: Refresh Pay-Skills Launch Queue

on:
  schedule:
    - cron: "47 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run pulse:pay-skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit queue update
        run: |
          if git diff --quiet -- pay-skills-launch-queue.html pay-skills-launch-queue.json; then
            echo "No queue changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pay-skills-launch-queue.html pay-skills-launch-queue.json
          git commit -m "Refresh pay-skills launch queue"
          git push
