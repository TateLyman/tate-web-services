name: Refresh x402 Ecosystem Radar

on:
  schedule:
    - cron: "22 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run pulse:x402-ecosystem
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit radar update
        run: |
          if git diff --quiet -- x402-ecosystem-radar.html x402-ecosystem-radar.json; then
            echo "No radar changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x402-ecosystem-radar.html x402-ecosystem-radar.json
          git commit -m "Refresh x402 ecosystem radar"
          git push
